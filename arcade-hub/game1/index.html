<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <title>Super Pixel Adventure GBA</title>
    <meta name="description" content="A classic 90s GBA-style retro platformer arcade game with smooth 60 FPS physics, pixel-art visuals, on-screen handheld controls, and nostalgic sound effects." />
    <meta property="og:title" content="Super Pixel Adventure GBA" />
    <meta property="og:description" content="A classic 90s GBA-style retro platformer arcade game with smooth 60 FPS physics, pixel-art visuals, on-screen handheld controls, and nostalgic sound effects." />
    <meta property="og:type" content="website" />
    <meta name="twitter:card" content="summary_large_image" />
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=Outfit:wght@400;600;700&display=swap" rel="stylesheet">
    <style>
      /* Ensure crisp pixel rendering across all browsers */
      canvas {
        image-rendering: -moz-crisp-edges;
        image-rendering: -webkit-crisp-edges;
        image-rendering: pixelated;
        image-rendering: crisp-edges;
      }
      .font-pixel {
        font-family: 'Press Start 2P', monospace, system-ui;
      }
      /* Prevent mobile pull-to-refresh and selection during touch gameplay */
      body, html {
        overscroll-behavior: none;
        touch-action: manipulation;
        -webkit-user-select: none;
        user-select: none;
        -webkit-touch-callout: none;
      }
    </style>
  </head>
  <body class="bg-slate-950 text-white overflow-hidden antialiased select-none">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
