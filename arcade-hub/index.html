<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RETRO ARCADE PORTAL - 90s Classics</title>
    <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            user-select: none;
        }

        body {
            background-color: #030308;
            color: #00ffcc;
            font-family: 'Press Start 2P', monospace, cursive;
            text-align: center;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            align-items: center;
            padding: 20px;
            overflow-x: hidden;
            position: relative;
        }

        /* CRT Overlay Effect */
        body::before {
            content: " ";
            display: block;
            position: fixed;
            top: 0; left: 0; bottom: 0; right: 0;
            background: linear-gradient(rgba(18, 16, 16, 0) 50%, rgba(0, 0, 0, 0.25) 50%);
            background-size: 100% 4px;
            z-index: 100;
            pointer-events: none;
        }

        header {
            margin-top: 20px;
            margin-bottom: 30px;
        }

        .title {
            font-size: 2.2rem;
            color: #ff007f;
            text-shadow: 4px 4px 0px #00f3ff, -2px -2px 0px #ffe600;
            letter-spacing: 3px;
            animation: pulseTitle 1.5s infinite alternate;
        }

        .subtitle {
            margin-top: 15px;
            color: #ffe600;
            font-size: 0.75rem;
            letter-spacing: 1px;
            text-shadow: 2px 2px #000;
        }

        /* 5 Game Cards Layout Grid */
        .arcade-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(260px, 1fr));
            gap: 25px;
            width: 100%;
            max-width: 1100px;
            margin: 0 auto;
            z-index: 10;
        }

        .game-card {
            background: #0d0b1d;
            border: 4px solid #00f3ff;
            border-radius: 12px;
            padding: 25px 15px;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            align-items: center;
            box-shadow: 0 0 15px rgba(0, 243, 255, 0.3), inset 0 0 15px rgba(0, 243, 255, 0.1);
            transition: all 0.25s ease-in-out;
            position: relative;
        }

        .game-card:hover {
            transform: translateY(-8px) scale(1.02);
            border-color: #ff007f;
            box-shadow: 0 0 30px rgba(255, 0, 127, 0.8), inset 0 0 20px rgba(255, 0, 127, 0.3);
        }

        .game-badge {
            font-size: 0.6rem;
            background: #ff007f;
            color: #fff;
            padding: 6px 10px;
            border-radius: 4px;
            margin-bottom: 15px;
            text-transform: uppercase;
        }

        .game-title {
            font-size: 0.85rem;
            color: #00f3ff;
            line-height: 1.4;
            margin-bottom: 20px;
            text-shadow: 2px 2px #000;
        }

        .play-btn {
            display: inline-block;
            width: 85%;
            padding: 14px 0;
            background: #00f3ff;
            color: #000;
            text-decoration: none;
            font-family: inherit;
            font-size: 0.75rem;
            font-weight: bold;
            border: 3px solid #fff;
            box-shadow: 4px 4px 0px #ff007f;
            cursor: pointer;
            transition: all 0.15s ease;
        }

        .play-btn:hover {
            background: #ff007f;
            color: #fff;
            box-shadow: 4px 4px 0px #ffe600;
        }

        footer {
            margin-top: 40px;
            font-size: 0.6rem;
            color: #666;
            letter-spacing: 1px;
        }

        @keyframes pulseTitle {
            0% { text-shadow: 4px 4px 0px #00f3ff, -2px -2px 0px #ffe600; }
            100% { text-shadow: 6px 6px 10px #ff007f, -4px -4px 10px #00f3ff; }
        }

        @media (max-width: 600px) {
            .title { font-size: 1.4rem; }
            .subtitle { font-size: 0.6rem; }
        }
    </style>
</head>
<body>

    <header>
        <h1 class="title">INSERT COIN</h1>
        <p class="subtitle">SELECT YOUR CLASSIC 90S ARCADE MISSION</p>
    </header>

    <main class="arcade-grid">
        <!-- Game 1 -->
        <div class="game-card">
            <div>
                <div class="game-badge">STAGE 01</div>
                <h2 class="game-title">Neon Tunnel 2099</h2>
            </div>
            <a href="./game1/index.html" class="play-btn">START GAME</a>
        </div>

        <!-- Game 2 -->
        <div class="game-card">
            <div>
                <div class="game-badge">STAGE 02</div>
                <h2 class="game-title">Astro Breaker</h2>
            </div>
            <a href="./game2/index.html" class="play-btn">START GAME</a>
        </div>

        <!-- Game 3 -->
        <div class="game-card">
            <div>
                <div class="game-badge">STAGE 03</div>
                <h2 class="game-title">Void Hopper</h2>
            </div>
            <a href="./game3/index.html" class="play-btn">START GAME</a>
        </div>

        <!-- Game 4 -->
        <div class="game-card">
            <div>
                <div class="game-badge">STAGE 04</div>
                <h2 class="game-title">Planet Defender</h2>
            </div>
            <a href="./game4/index.html" class="play-btn">START GAME</a>
        </div>

        <!-- Game 5 -->
        <div class="game-card">
            <div>
                <div class="game-badge">STAGE 05</div>
                <h2 class="game-title">Blastar Final Orbit</h2>
            </div>
            <a href="./game5/index.html" class="play-btn">START GAME</a>
        </div>
    </main>

    <footer>
        <p>© 1990-2026 RETRO ARCADE HUB • ALL RIGHTS RESERVED</p>
    </footer>

</body>
</html>
